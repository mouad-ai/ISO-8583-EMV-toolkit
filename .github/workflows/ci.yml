name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and verify plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the release zip on main
    steps:
      - uses: actions/checkout@v4

      # IDE downloads for the plugin verifier need several GB.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew check --console=plain

      - name: Build plugin
        run: ./gradlew buildPlugin --console=plain

      - name: Verify plugin
        run: ./gradlew verifyPlugin --console=plain

      - name: Upload test and verifier reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            */build/reports/
            plugin/build/reports/pluginVerifier/
          if-no-files-found: ignore

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: cardmsg-plugin
          path: plugin/build/distributions/*.zip

      # On main, a non-snapshot version is published as a GitHub release "v<version>" with the
      # plugin zip attached, ready to upload to JetBrains Marketplace.
      - name: Publish release zip
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^version' gradle.properties | cut -d= -f2 | tr -d ' ')
          case "$version" in *SNAPSHOT*) echo "Snapshot version $version, no release"; exit 0;; esac
          zip=$(ls plugin/build/distributions/*.zip)
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" "$zip" --clobber
          else
            gh release create "v$version" "$zip" --target "$GITHUB_SHA" \
              --title "Card Message Toolkit $version" \
              --notes "Plugin zip for JetBrains Marketplace. See CHANGELOG.md."
          fi
