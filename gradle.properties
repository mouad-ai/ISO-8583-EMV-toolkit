group = io.github.mouadai.octet
version = 0.1.0-SNAPSHOT

# IntelliJ baseline (see DECISIONS.md). 2025.3+ ships a single unified IntelliJ IDEA
# distribution, so one target covers both former Community and Ultimate editions.
platformVersion = 2025.3
pluginSinceBuild = 253

# The IDE provides the Kotlin stdlib at runtime; never bundle our own copy.
kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching = true
org.gradle.configuration-cache = true
